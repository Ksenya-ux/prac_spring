[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mood-mud"
version = "0.1.0"
description = "Client and server for a small multiplayer MUD game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cowsay-python>=1.0",
]

[project.scripts]
mood-client = "mood.client.client:main"
mood-server = "mood.server.server:serve"

[tool.setuptools]
packages = [
    "mood",
    "mood.client",
    "mood.server",
    "mood.common",
    "mood.tests",
]
include-package-data = true

[tool.setuptools.package-data]
"mood" = ["extra_monsters/*.txt", "docs/html/*", "docs/html/**/*"]
"mood.server" = ["po/ru/LC_MESSAGES/*.mo"]
